# n8n for Mete's server: reads LinkedIn job-alert emails and hands them to JobImporter (-> JobHunter).
# Own compose project, own named volume (SQLite inside it); touches no other container or volume.
name: n8n

services:
  n8n:
    image: n8nio/n8n:2.48.7
    container_name: n8n
    restart: unless-stopped
    # Only on this machine and on the tailnet. Never 0.0.0.0.
    ports:
      - "127.0.0.1:5678:5678"
      - "100.72.60.5:5678:5678"       # Tailscale IP of server-x570-aorus-master
    env_file:
      - .env                          # N8N_ENCRYPTION_KEY (chmod 600, generated once; keep it with backups)
    environment:
      TZ: Europe/Amsterdam
      GENERIC_TIMEZONE: Europe/Amsterdam
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: "2"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Google OAuth only allows http on localhost: the one-time "Sign in with Google" is done through
      # http://localhost:5678 (on the server or via an SSH tunnel). Everything else works on the Tailscale URL.
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      # Plain http over the tailnet (WireGuard-encrypted) needs non-secure cookies.
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.ssh"]'
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # hours (14 days)
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    # default = internet (Gmail API); jobalerts = private network to job_importer:8765 (created by JobImporter);
    # jobhunter_net = JobHunter's network, so agentic_job_hunter can call http://n8n:5678/webhook/... (no new ports).
    networks: [default, jobalerts, jobhunter_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  n8n_data:
    name: n8n_data

networks:
  jobalerts:
    external: true
    name: jobalerts
  jobhunter_net:
    external: true
    name: jobhunter_net
